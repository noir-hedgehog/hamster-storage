# 家庭收纳 - 单服务编排（前端+后端一体）
# 使用方式：在项目根目录执行 docker-compose up -d --build

name: storage-app

services:
  app:
    build: .
    image: storage-app:latest
    container_name: storage-app
    ports:
      - "3847:3847"
    environment:
      NODE_ENV: production
      PORT: 3847
      DATABASE_PATH: /app/data/storage.db
      # 若通过同一域名访问，CORS 可留空或设为前端地址
      CORS_ORIGIN: ""
    volumes:
      # 持久化 SQLite 数据库与上传文件（如有）
      - storage-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3847/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  storage-data:
